###############################################################################
# /etc/sysctl.conf â€” Hardened Router Baseline (OpenBSD 7.7)
# Goals: predictable behavior, minimal attack surface, reload-safe (sysctl -f).
###############################################################################

##### 0) Memory hardening
vm.malloc_conf=CFGJRS              # Guard/Junk/RedZone/Canaries

##### 1) CPU / hardware
hw.smt=0                           # Disable SMT/HT (side-channel risk)
machdep.allowaperture=0            # Block /dev/mem aperture (safe for headless)

##### 2) Routing & tunnels
net.inet.ip.forwarding=1           # IPv4 routing on
net.inet6.ip6.forwarding=0         # IPv6 routing off (enable only with matching PF rules)

# Reduce attack surface: disable unused tunnels/crypto
net.inet.ipip.allow=0
net.inet.gre.allow=0
net.inet.esp.enable=0
net.inet.ah.enable=0
net.inet.etherip.allow=0

##### 3) IPv4: legacy & redirects
net.inet.ip.directed-broadcast=0   # No smurf/amplification
net.inet.ip.redirect=0             # Do not send redirects
net.inet.icmp.rediraccept=0        # Do not accept ICMP redirects
net.inet.icmp.redirtimeout=0       # If any slipped in: drop immediately

##### 4) IPv6: defensive defaults
net.inet6.ip6.redirect=0           # No IPv6 redirects
net.inet6.icmp6.errppslimit=10     # Rate-limit ICMPv6 errors

##### 5) ICMP (IPv4)
net.inet.icmp.bmcastecho=0         # No broadcast echo replies
net.inet.icmp.errppslimit=50       # Rate-limit ICMP error generation
net.inet.icmp.maskrepl=0           # No netmask replies
net.inet.icmp.tstamprepl=0         # No timestamp replies

##### 6) UDP
net.inet.udp.checksum=1            # Enforce checksums
net.inet.udp.sendspace=65536       # Practical socket defaults
net.inet.udp.recvspace=65536

##### 7) TCP
net.inet.tcp.always_keepalive=0    # Avoid global keepalives (reduce leaks)
net.inet.tcp.rfc1323=1             # Window scaling / TSopt on
net.inet.tcp.sack=1                # Selective ACKs on
net.inet.tcp.rstppslimit=100       # Throttle RST floods
net.inet.tcp.ecn=1                 # ECN on (modern networks)
net.inet.tcp.syncachelimit=1024    # SYN cache/bucket limits (DoS damping)
net.inet.tcp.synbucketlimit=100
# MSS tuning is handled via PF scrub (max-mss), not here

##### 8) Interface queue
net.inet.ip.ifq.maxlen=1024        # Larger ifq to reduce drops under load

##### 9) BPF (capture buffers)
net.bpf.maxbufsize=67108864        # Upper bound for BPF buffers
net.bpf.bufsize=32768              # Default per-descriptor buffer

##### 10) Kernel hardening
vm.swapencrypt.enable=1            # Encrypted swap (default, keep explicit)
kern.wxabort=1                     # Enforce W^X: abort on violations (fail-closed)
